name: vercel-production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: 54.6.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            raycast/fieldtheory/package-lock.json
            apps/portal/package-lock.json
      - name: Require production Vercel secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Production deploy requires VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: HOME="$(mktemp -d)" npm test
      - run: npm run release:check
      - run: git diff --check
      - run: npm --prefix raycast/fieldtheory ci
      - run: npm --prefix raycast/fieldtheory run lint
      - run: npm --prefix raycast/fieldtheory run build
      - run: npm --prefix apps/portal ci
      - run: npm run verify:hosted
      - run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Pull Vercel production environment
        working-directory: apps/portal
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build Vercel production artifact
        working-directory: apps/portal
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy Vercel production artifact
        working-directory: apps/portal
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
