name: vercel-production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fieldtheory
          POSTGRES_PASSWORD: fieldtheory
          POSTGRES_DB: fieldtheory_portal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldtheory -d fieldtheory_portal_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PRODUCTION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PRODUCTION_PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
      PRODUCTION_NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
      PRODUCTION_PRIVY_APP_SECRET: ${{ secrets.PRIVY_APP_SECRET }}
      PRODUCTION_PRIVY_JWT_VERIFICATION_KEY: ${{ secrets.PRIVY_JWT_VERIFICATION_KEY }}
      X402_ENABLED: ${{ vars.X402_ENABLED }}
      VERCEL_CLI_VERSION: 54.6.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            raycast/fieldtheory/package-lock.json
            apps/portal/package-lock.json
      - name: Require production deploy secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID PRODUCTION_DATABASE_URL PRODUCTION_PRIVY_APP_ID PRODUCTION_NEXT_PUBLIC_PRIVY_APP_ID PRODUCTION_PRIVY_APP_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Production deploy requires $name."
              missing=1
            fi
          done
          if [ "${X402_ENABLED:-false}" != "false" ]; then
            echo "::error::Production deploy requires X402_ENABLED=false until the x402 handoff is implemented."
            missing=1
          fi
          exit "$missing"
      - run: npm ci
      - run: npm run build
      - run: HOME="$(mktemp -d)" npm test
      - run: npm run release:check
      - run: git diff --check
      - run: npm --prefix raycast/fieldtheory ci
      - run: npm --prefix raycast/fieldtheory run lint
      - run: npm --prefix raycast/fieldtheory run build
      - run: npm --prefix apps/portal ci
      - run: DATABASE_URL="postgres://fieldtheory:fieldtheory@127.0.0.1:5432/fieldtheory_portal_ci" npm --prefix apps/portal run db:migrate
      - run: DATABASE_URL="postgres://fieldtheory:fieldtheory@127.0.0.1:5432/fieldtheory_portal_ci" npm run portal:test:db
      - run: npm run verify:hosted
      - run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Migrate target production database
        run: npm --prefix apps/portal run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Pull Vercel production environment
        working-directory: apps/portal
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build Vercel production artifact
        working-directory: apps/portal
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy Vercel production artifact
        id: deploy
        working-directory: apps/portal
        run: |
          deployment_output="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          printf '%s\n' "$deployment_output"
          deployment_url="$(printf '%s\n' "$deployment_output" | awk '/^https:\/\// { url=$0 } END { print url }')"
          case "$deployment_url" in
            https://*) ;;
            *)
              echo "::error::Vercel deploy did not return an https deployment URL."
              exit 1
              ;;
          esac
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Smoke production public endpoints
        run: |
          health="$(curl -fsS "${{ steps.deploy.outputs.url }}/api/health")"
          HEALTH="$health" node -e '
            const body = JSON.parse(process.env.HEALTH || "{}");
            const readiness = body.readiness || {};
            const ok = body.status === "configuration_ready"
              && readiness.authConfigured === true
              && readiness.durableStoreConfigured === true
              && readiness.mutableRoutesReady === true
              && body.x402Enabled === false;
            if (!ok) {
              console.error("Production health is not configuration_ready with auth/store/x402 gates satisfied.");
              console.error(JSON.stringify(body, null, 2));
              process.exit(1);
            }
          '
          curl -fsS "${{ steps.deploy.outputs.url }}/api/contracts"
          curl -fsS "${{ steps.deploy.outputs.url }}/api/x402/discovery"
          auth_status="$(curl -sS -o /tmp/fieldtheory-auth-smoke.json -w "%{http_code}" "${{ steps.deploy.outputs.url }}/api/agents")"
          if [ "$auth_status" != "401" ]; then
            echo "::error::Expected unauthenticated protected route to return 401, got $auth_status."
            cat /tmp/fieldtheory-auth-smoke.json
            exit 1
          fi
